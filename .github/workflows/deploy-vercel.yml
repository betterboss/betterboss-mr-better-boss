name: Deploy to Vercel

on:
  push:
    branches: [main, "claude/*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET }}
          NEXTAUTH_URL: ${{ secrets.NEXTAUTH_URL }}
          JOBTREAD_API_URL: https://api.jobtread.com/graphql
          JOBTREAD_SERVICE_TOKEN: ${{ secrets.JOBTREAD_SERVICE_TOKEN }}
          GHL_API_KEY: ${{ secrets.GHL_API_KEY }}
          GHL_LOCATION_ID: ${{ secrets.GHL_LOCATION_ID }}
          WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}

      - name: Install Vercel CLI
        run: npm install -g vercel

      - name: Pull Vercel Environment
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build for Vercel
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy to Vercel (Production)
        if: github.ref == 'refs/heads/main'
        run: |
          url=$(vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }})
          echo "DEPLOY_URL=$url" >> $GITHUB_ENV
          echo "### Deployed to Production" >> $GITHUB_STEP_SUMMARY
          echo "$url" >> $GITHUB_STEP_SUMMARY

      - name: Deploy to Vercel (Preview)
        if: github.ref != 'refs/heads/main'
        run: |
          url=$(vercel deploy --prebuilt --token=${{ secrets.VERCEL_TOKEN }})
          echo "DEPLOY_URL=$url" >> $GITHUB_ENV
          echo "### Preview Deployment" >> $GITHUB_STEP_SUMMARY
          echo "$url" >> $GITHUB_STEP_SUMMARY

      - name: Register webhook connectors
        if: env.DEPLOY_URL != ''
        env:
          WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}
        run: |
          echo "Waiting 10s for deployment to warm up..."
          sleep 10
          echo "Registering connectors at $DEPLOY_URL..."
          response=$(curl -s -w "\n%{http_code}" -X POST \
            "$DEPLOY_URL/api/auto-setup?secret=$WEBHOOK_SECRET" \
            -H "Content-Type: application/json" \
            -d "{\"secret\":\"$WEBHOOK_SECRET\",\"appUrl\":\"$DEPLOY_URL\"}")
          http_code=$(echo "$response" | tail -1)
          body=$(echo "$response" | head -n -1)
          echo "HTTP $http_code"
          echo "$body" | jq . 2>/dev/null || echo "$body"
          if [ "$http_code" = "200" ]; then
            echo "### Connectors Registered" >> $GITHUB_STEP_SUMMARY
            echo '```json' >> $GITHUB_STEP_SUMMARY
            echo "$body" | jq . >> $GITHUB_STEP_SUMMARY 2>/dev/null || echo "$body" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          else
            echo "### Connector Registration Failed (HTTP $http_code)" >> $GITHUB_STEP_SUMMARY
            echo "Manual setup: Open $DEPLOY_URL/settings and click Connect & Save" >> $GITHUB_STEP_SUMMARY
          fi
