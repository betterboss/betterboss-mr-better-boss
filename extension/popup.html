<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Better Boss DocFill</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div class="p">
    <div class="p-hd">
      <div class="p-logo">B</div>
      <div>
        <div class="p-title">Better Boss <span class="accent">DocFill</span></div>
        <div class="p-sub">v3.0</div>
      </div>
    </div>

    <div class="p-profile" id="profile">
      <div class="p-avatar" id="avatar">BB</div>
      <div><strong id="name">—</strong><span id="company"></span></div>
    </div>

    <div class="p-status">
      <span class="dot" id="dot"></span>
      <span id="status">Checking…</span>
    </div>

    <div class="p-cta" id="cta" style="display:none">
      <p>Set up your profile to get started.</p>
      <button class="btn" id="setup">Set Up Profile</button>
    </div>

    <div class="p-keys">
      <div class="key"><kbd>Ctrl+Shift+B</kbd><span>Toggle panel</span></div>
    </div>

    <button class="btn" id="open" style="display:none">Open DocFill</button>
    <button class="btn btn--ghost" id="opts">Settings</button>

    <div class="p-ft">Better Boss · <a href="https://better-boss.ai" target="_blank">better-boss.ai</a></div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
