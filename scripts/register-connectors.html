<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BetterBoss — Register Connectors</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #0f1117; color: #e2e8f0; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
  .card { background: #1a1d2e; border: 1px solid #2d3348; border-radius: 16px; padding: 32px; max-width: 560px; width: 100%; }
  h1 { font-size: 20px; margin-bottom: 4px; }
  .sub { color: #64748b; font-size: 13px; margin-bottom: 24px; }
  label { display: block; font-size: 12px; color: #94a3b8; margin-bottom: 4px; margin-top: 16px; }
  input { width: 100%; background: #0f1117; border: 1px solid #2d3348; border-radius: 8px; padding: 10px 12px; color: #e2e8f0; font-size: 13px; font-family: monospace; }
  input:focus { outline: none; border-color: #3b82f6; }
  .btn { display: block; width: 100%; padding: 12px; border: none; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; margin-top: 24px; transition: all 0.15s; }
  .btn-primary { background: #3b82f6; color: white; }
  .btn-primary:hover { background: #2563eb; }
  .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
  .log { margin-top: 20px; background: #0f1117; border: 1px solid #2d3348; border-radius: 8px; padding: 16px; font-size: 12px; font-family: monospace; max-height: 400px; overflow-y: auto; white-space: pre-wrap; line-height: 1.8; }
  .ok { color: #22c55e; } .fail { color: #ef4444; } .warn { color: #f59e0b; } .info { color: #64748b; }
  .urls { margin-top: 16px; background: #0f1117; border: 1px solid #2d3348; border-radius: 8px; padding: 12px; }
  .urls label { margin-top: 8px; }
  .urls input { margin-bottom: 4px; }
  .copy-hint { font-size: 10px; color: #475569; }
  .note { background: #1e293b; border: 1px solid #334155; border-radius: 8px; padding: 12px; margin-top: 16px; font-size: 11px; color: #94a3b8; line-height: 1.6; }
  .note strong { color: #e2e8f0; }
</style>
</head>
<body>
<div class="card">
  <h1>BetterBoss Connector Setup</h1>
  <p class="sub">Calls your deployed app to register webhooks with JT and GHL. No CORS issues.</p>

  <label>Your App URL (Vercel / production)</label>
  <input id="appUrl" placeholder="https://your-app.vercel.app" autofocus />

  <label>Webhook Secret</label>
  <input id="secret" value="2d37c7502ece3eb90e58ee8e313fbdd17fbc92bee7368c9ed5acdc250c1037b8" />

  <div class="note">
    <strong>How it works:</strong> This calls <code>/api/auto-setup</code> on your deployed app.
    Your app makes the JT and GHL API calls server-side (no CORS).
    Credentials are read from your env vars on Vercel.
  </div>

  <button class="btn btn-primary" id="goBtn" onclick="runSetup()">Register Connectors</button>

  <div id="logBox" class="log" style="display:none"></div>
  <div id="urlBox" class="urls" style="display:none"></div>
</div>

<script>
const $ = id => document.getElementById(id);
const log = $('logBox');
const urlBox = $('urlBox');

function out(cls, msg) {
  log.style.display = 'block';
  log.innerHTML += `<span class="${cls}">${msg}</span>\n`;
  log.scrollTop = log.scrollHeight;
}

async function runSetup() {
  const appUrl = $('appUrl').value.trim().replace(/\/$/, '');
  const secret = $('secret').value.trim();

  log.innerHTML = '';
  urlBox.style.display = 'none';
  $('goBtn').disabled = true;
  $('goBtn').textContent = 'Registering...';

  if (!appUrl) {
    out('fail', 'Enter your deployed app URL (e.g. https://your-app.vercel.app)');
    $('goBtn').disabled = false;
    $('goBtn').textContent = 'Register Connectors';
    return;
  }
  if (!secret) {
    out('fail', 'Enter your webhook secret.');
    $('goBtn').disabled = false;
    $('goBtn').textContent = 'Register Connectors';
    return;
  }
  if (appUrl.includes('localhost')) {
    out('warn', 'localhost URLs won\'t work for webhooks — JT and GHL can\'t reach localhost.');
    out('info', 'Use your Vercel URL. Continuing anyway for testing...');
  }

  out('info', `Calling ${appUrl}/api/auto-setup ...`);
  out('info', '(Your app will call JT + GHL APIs server-side)');
  out('info', '');

  try {
    const res = await fetch(`${appUrl}/api/auto-setup?secret=${encodeURIComponent(secret)}`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ secret, appUrl }),
    });

    const text = await res.text();
    let data;
    try { data = JSON.parse(text); } catch {
      out('fail', `Server returned non-JSON: ${text.slice(0, 200)}`);
      $('goBtn').disabled = false;
      $('goBtn').textContent = 'Try Again';
      return;
    }

    if (!res.ok) {
      out('fail', `Server error ${res.status}: ${data.error || text.slice(0, 200)}`);
      if (res.status === 401) out('info', 'Check your webhook secret matches what\'s in your Vercel env vars.');
      if (res.status === 404) {
        out('info', 'The /api/auto-setup endpoint was not found.');
        out('info', 'Make sure you\'ve deployed the latest code from branch claude/access-bolt-app-0RqE4');
      }
      $('goBtn').disabled = false;
      $('goBtn').textContent = 'Try Again';
      return;
    }

    // Show results
    if (data.jtConnected) out('ok', `JobTread: Connected${data.jtUser ? ' as ' + data.jtUser : ''}`);
    else out('fail', `JobTread: ${data.jtError || 'Not connected'}`);

    if (data.ghlConnected) out('ok', `GoHighLevel: Connected (${data.ghlContactCount || 0} contacts)`);
    else out('fail', `GoHighLevel: ${data.ghlError || 'Not connected'}`);

    out('info', '');

    // Webhook registration results
    if (data.ghlWebhook === 'registered') out('ok', `GHL webhook: Registered (ID: ${data.ghlWebhookId})`);
    else if (data.ghlWebhook === 'already registered') out('ok', `GHL webhook: Already active (ID: ${data.ghlWebhookId})`);
    else if (data.ghlWebhook === 'manual') out('warn', `GHL webhook: ${data.ghlWebhookNote || 'Manual setup needed'}`);
    else if (data.ghlWebhookError) out('fail', `GHL webhook error: ${data.ghlWebhookError}`);

    if (data.jtWebhook === 'registered') out('ok', `JT webhook: Registered (ID: ${data.jtWebhookId})`);
    else if (data.jtWebhook === 'already registered') out('ok', `JT webhook: Already active (ID: ${data.jtWebhookId})`);
    else if (data.jtWebhook === 'manual') out('warn', `JT webhook: ${data.jtWebhookNote || 'Manual setup needed'}`);

    out('info', '');
    out(data.ready ? 'ok' : 'warn', data.message || 'Setup complete.');

    // Show webhook URLs for manual setup if needed
    if (data.webhookUrls) {
      urlBox.style.display = 'block';
      urlBox.innerHTML = `
        <label>JT → GHL Webhook URL</label>
        <input readonly value="${data.webhookUrls.jt}" onclick="this.select()" />
        <p class="copy-hint">For JT Workflows: Trigger "Contact Created" → Action "Send Webhook" → paste this URL</p>
        <label>GHL → JT Webhook URL</label>
        <input readonly value="${data.webhookUrls.ghl}" onclick="this.select()" />
        <p class="copy-hint">For GHL Automations: Trigger "Contact Created" → Action "Webhook" → paste this URL</p>
      `;
    }

  } catch (e) {
    out('fail', `Could not reach ${appUrl}: ${e.message}`);
    out('info', '');
    out('info', 'Possible causes:');
    out('info', '  1. App not deployed yet — deploy to Vercel first');
    out('info', '  2. Wrong URL — check the URL is correct');
    out('info', '  3. CORS — the /api/auto-setup endpoint may not be deployed yet');
    out('info', '');
    out('info', 'Quick deploy: merge branch claude/access-bolt-app-0RqE4 into main');
  }

  $('goBtn').disabled = false;
  $('goBtn').textContent = 'Run Again';
}
</script>
</body>
</html>
